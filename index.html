<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Online gratuita</title>

    <meta name="description" content="Calculadora online gratuita e fácil de usar. Faça cálculos matemáticos simples e complexos direto no seu navegador.">
    <meta name="robots" content="index, follow">

    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="style.css">  
    <script src="script.js" defer></script>  
</head>
<body>
<body>
    <header>
        <h1>Calculadora Online</h1>

        <button type="button" id="theme-toggle" class="btn-theme-toggle" aria-label="Mudar tema do site">
            🌓 Alterar Tema
        </button>

    </header>

    <main class="container">
        
        <div role="group" class="moldura" aria-label="Calculadora">
            
            <output id="display" aria-live="polite" aria-label="Resultado">0</output>
            
            <div class="buttons">
                
                <button type="button" class="btn-clear" data-action="clear" aria-label="limpar">C</button>
                <button type="button" data-num="7">7</button>
                <button type="button" data-num="8">8</button>
                <button type="button" data-num="9">9</button>
                <button type="button" class="btn-op" data-op="/" aria-label="Dividir">/</button>

                <button type="button" data-num="4">4</button>
                <button type="button" data-num="5">5</button>
                <button type="button" data-num="6">6</button>
                <button type="button" class="btn-op" data-op="*" aria-label="Multiplicar">*</button>

                <button type="button" data-num="1">1</button>
                <button type="button" data-num="2">2</button>
                <button type="button" data-num="3">3</button>
                <button type="button" class="btn-op" data-op="-" aria-label="Subtrair">-</button>

                <button type="button" data-num="0">0</button>
                <button type="button" data-num=".">.</button>
                <button type="button" class="btn-equal" data-action="calculate" aria-label="Calcular">=</button>
                <button type="button" class="btn-op" data-op="+" aria-label="Somar">+</button>
            </div>
        </div>

        <section class="history-panel" aria-labelledby="history-title">
            <h2 id="history-title">Histórico</h2>
            <ul id="history-list" aria-live="polite">
                <li class="empty-msg">Nenhum cálculo recente</li>
            </ul>
            <button type="button" id="clear-history" aria-label="Limpar histórico de cálculos">Limpar Histórico</button>
        </section>

    </main>
    </footer> <!-- Fim do main -->

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 Calculadora Online. Todos os direitos reservados.</p>
            <p>Desenvolvido por <a href="https://github.com/TiagoQueiroZzZ" target="_blank" rel="noopener noreferrer">Tiago Queiroz</a></p>
        </div>
    </footer>
</body>
</html>
